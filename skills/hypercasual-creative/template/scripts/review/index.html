<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Review</title>
<style>
  :root { --bg: #14161b; --panel: #1c1f26; --line: #2b2f39; --text: #e8eaf0; --dim: #8b90a0; --accent: #ffd23a; --open: #ff5a7a; --done: #4fd18b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  body { display: grid; grid-template-columns: 1fr 360px; grid-template-rows: 1fr auto; height: 100vh; }
  #stage { position: relative; display: grid; place-items: center; overflow: hidden; padding: 16px; }
  #frame { position: relative; height: 100%; max-width: 100%; }
  #frame video, #frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #frame canvas.draw { cursor: crosshair; }
  #frame canvas:not(.draw) { pointer-events: none; }
  #bar { grid-column: 1 / 2; padding: 10px 16px 14px; border-top: 1px solid var(--line); background: var(--panel); }
  #controls { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  #controls .readout { font-variant-numeric: tabular-nums; margin-left: auto; color: var(--dim); }
  #controls .readout b { color: var(--text); }
  #beat { color: var(--accent); }
  button { background: #2a2e38; color: var(--text); border: 1px solid #3a3f4c; border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button:hover { background: #343947; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.on { background: var(--accent); color: #111; border-color: var(--accent); }
  #timeline { width: 100%; height: 46px; display: block; cursor: pointer; }
  aside { grid-row: 1 / 3; grid-column: 2; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside h1 { font-size: 15px; margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #ver { background: #121419; color: var(--text); border: 1px solid #2f3440; border-radius: 8px; padding: 5px 8px; font: 500 13px system-ui; }
  #oldver { margin: 10px 16px 0; padding: 8px 10px; border-radius: 10px; background: rgba(255, 210, 58, .1); color: var(--accent); font-size: 13px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #oldver[hidden] { display: none; }
  #oldver button { padding: 3px 8px; font-size: 12px; }
  #toast { position: fixed; left: 50%; top: 18px; translate: -50% 0; padding: 10px 16px; border-radius: 12px; background: var(--accent); color: #17140a; font-weight: 600; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); opacity: 0; transition: opacity .25s, translate .25s; pointer-events: none; }
  #toast.on { opacity: 1; translate: -50% 4px; }
  aside h1 small { color: var(--dim); font-weight: 400; }
  #compose { padding: 14px 16px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
  #compose textarea { width: 100%; min-height: 76px; resize: none; background: #121419; color: var(--text); border: 1px solid #2f3440; border-radius: 12px; padding: 10px 12px; font: inherit; transition: border-color .15s, box-shadow .15s; }
  #compose textarea::placeholder { color: #626877; }
  #compose textarea:focus { outline: none; border-color: #4a5060; box-shadow: 0 0 0 3px rgba(255, 210, 58, .12); }
  #tools { display: flex; align-items: center; gap: 4px; padding: 4px; background: #121419; border: 1px solid #2f3440; border-radius: 12px; }
  #tools .sep { width: 1px; align-self: stretch; margin: 4px 2px; background: #2f3440; }
  .tool { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; background: transparent; border: 0; border-radius: 8px; color: #b8bdca; }
  .tool:hover { background: #232733; color: var(--text); }
  .tool.icon { width: 32px; padding: 0; justify-content: center; }
  .tool svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tool.on { background: var(--accent); color: #17140a; }
  #swatches { display: inline-flex; gap: 2px; margin-right: auto; }
  .swatch { position: relative; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 50%; background: transparent; display: grid; place-items: center; }
  .swatch::after { content: ''; width: 16px; height: 16px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25); transition: transform .12s; }
  .swatch:hover { background: transparent; }
  .swatch:hover::after { transform: scale(1.12); }
  .swatch.on { box-shadow: inset 0 0 0 2px var(--c); }
  .swatch.on::after { transform: scale(.78); }
  button.primary { height: 40px; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent); color: #17140a; border: 0; border-radius: 12px; font-weight: 600; transition: filter .15s, transform .05s; }
  button.primary:hover { background: var(--accent); filter: brightness(1.06); }
  button.primary:active { transform: translateY(1px); }
  button.primary:disabled { opacity: .6; }
  button.primary kbd { background: rgba(0, 0, 0, .12); border: 0; color: rgba(23, 20, 10, .7); padding: 1px 6px; border-radius: 5px; font: 600 11px system-ui; }
  #notes { overflow: auto; flex: 1; padding: 8px; }
  .note { padding: 10px; border-radius: 10px; border: 1px solid var(--line); margin-bottom: 8px; cursor: pointer; }
  .note:hover { background: #232733; }
  .note.sel { border-color: var(--accent); }
  .note .head { display: flex; gap: 8px; align-items: center; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .note .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--open); }
  .note.done .dot { background: var(--done); }
  .note.done .text { color: var(--dim); text-decoration: line-through; }
  .note .text { margin-top: 4px; white-space: pre-wrap; }
  .note .reply { margin-top: 6px; color: var(--done); font-size: 12px; }
  .note .acts { margin-top: 6px; display: flex; gap: 6px; }
  .note .acts button { padding: 2px 8px; font-size: 12px; }
  .hint { color: var(--dim); font-size: 12px; }
  kbd { background: #2a2e38; border: 1px solid #3a3f4c; border-radius: 4px; padding: 0 4px; font-size: 11px; }
</style>
</head>
<body>
  <div id="stage">
    <div id="frame">
      <video id="v" preload="auto" playsinline></video>
      <canvas id="show"></canvas>
      <canvas id="ink"></canvas>
    </div>
  </div>
  <div id="bar">
    <div id="controls">
      <button id="play" title="Space">Play</button>
      <button id="prev" title="←">−1</button>
      <button id="next" title="→">+1</button>
      <span id="beat"></span>
      <span class="readout">frame <b id="fr">0</b> / <span id="frs">0</span> · <b id="tm">0.00s</b></span>
    </div>
    <canvas id="timeline"></canvas>
  </div>
  <aside>
    <h1 id="title"><span>Review <small></small></span><select id="ver" aria-label="Render version"></select></h1>
    <div id="oldver" hidden>Viewing an older render. <button id="toLatest">Go to latest</button></div>
    <div id="compose">
      <textarea id="text" placeholder="What should change on this frame?"></textarea>
      <div id="tools" role="toolbar" aria-label="Brush">
        <button id="drawBtn" class="tool" title="Draw (D)" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>
          <span>Draw</span>
        </button>
        <span class="sep"></span>
        <span id="swatches"></span>
        <span class="sep"></span>
        <button id="undo" class="tool icon" title="Undo (⌘Z)" aria-label="Undo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <button id="clear" class="tool icon" title="Clear drawing" aria-label="Clear drawing">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>
        </button>
      </div>
      <button id="add" class="primary" title="Add note (⌘↵)">Add note <kbd>⌘↵</kbd></button>
    </div>
    <div id="notes"></div>
  </aside>
  <div id="toast" role="status" aria-live="polite"></div>
<script>
const $ = (s) => document.querySelector(s);
const v = $('#v'), ink = $('#ink'), show = $('#show'), tl = $('#timeline');
const COLORS = ['#ff3b5c', '#ffd23a', '#3be27a', '#3bb8ff', '#ffffff'];
let meta, version = 0, versions = [], allNotes = [], notes = [], frame = 0, drawing = false, strokes = [], color = COLORS[0], sel = null;

const fit = () => {
  const box = $('#stage').getBoundingClientRect();
  const h = Math.min(box.height - 32, (box.width - 32) * meta.height / meta.width);
  $('#frame').style.height = h + 'px';
  $('#frame').style.width = (h * meta.width / meta.height) + 'px';
  tl.width = tl.clientWidth * devicePixelRatio;
  tl.height = tl.clientHeight * devicePixelRatio;
  drawTimeline();
};

const latest = () => versions[versions.length - 1]?.v ?? 0;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast.h);
  toast.h = setTimeout(() => t.classList.remove('on'), 3500);
}
function renderVersions() {
  $('#ver').innerHTML = versions.slice().reverse().map((x) => `<option value="${x.v}">v${x.v}${x.v === latest() ? ' · latest' : ''}${x.notes ? ` · ${x.open ? x.open + ' open' : 'all done'}` : ''}</option>`).join('');
  $('#ver').value = version;
  $('#oldver').hidden = version === latest();
}
async function fetchVersions() {
  versions = (await (await fetch('/api/versions')).json()).versions;
}
// Each version is its own sheet: its video, its beats, its notes.
async function loadVersion(n) {
  version = n;
  meta = await (await fetch(`/api/meta?v=${n}`)).json();
  for (const c of [ink, show]) { c.width = meta.width; c.height = meta.height; }
  $('#title small').textContent = `${meta.name} · ${meta.fps}fps`;
  $('#frs').textContent = meta.frames - 1;
  v.pause();
  v.src = `/video?v=${n}`;
  strokes = [];
  redrawInk();
  sel = null;
  renderVersions();
  await reload();
  fit();
  goto(0);
}
// A re-render shows up as a new version: jump to it if we were on the latest.
setInterval(async () => {
  const before = latest();
  await fetchVersions();
  if (latest() > before) {
    if (version === before) {
      await loadVersion(latest());
      toast(`New render v${latest()} loaded`);
    } else toast(`New render v${latest()} is available`);
  }
  renderVersions();
}, 2500);

async function init() {
  await fetchVersions();
  COLORS.forEach((c) => {
    const b = document.createElement('button');
    b.className = 'swatch' + (c === color ? ' on' : '');
    b.style.setProperty('--c', c);
    b.setAttribute('aria-label', `Brush ${c}`);
    b.onclick = () => { color = c; document.querySelectorAll('.swatch').forEach((x) => x.classList.toggle('on', x === b)); setDraw(true); };
    $('#swatches').appendChild(b);
  });
  addEventListener('resize', fit);
  $('#ver').onchange = (e) => loadVersion(parseInt(e.target.value, 10));
  $('#toLatest').onclick = () => loadVersion(latest());
  await loadVersion(latest());
  tick();
}

async function reload() {
  allNotes = await (await fetch('/api/notes')).json();
  notes = allNotes.filter((n) => n.version === version).sort((a, b) => a.frame - b.frame);
  renderNotes();
  drawTimeline();
  paintShown();
}

// Frame clock: rVFC gives the presented frame's media time during playback.
const timeOf = (f) => (f + 0.5) / meta.fps;
// Coalesce seeks while scrubbing: one in flight, only the latest queued.
let seeking = false, pending = null;
function flushSeek() {
  if (pending === null) return;
  seeking = true;
  v.currentTime = timeOf(pending);
  pending = null;
}
v.addEventListener('seeked', () => { seeking = false; flushSeek(); paintShown(); });
function goto(f) {
  frame = Math.max(0, Math.min(meta.frames - 1, f));
  pending = frame;
  if (!seeking) flushSeek();
  update();
}
function tick() {
  if ('requestVideoFrameCallback' in v) {
    const cb = (_, m) => { if (!v.paused) { frame = Math.min(meta.frames - 1, Math.floor(m.mediaTime * meta.fps + 1e-3)); update(); } v.requestVideoFrameCallback(cb); };
    v.requestVideoFrameCallback(cb);
  } else {
    const loop = () => { if (!v.paused) { frame = Math.floor(v.currentTime * meta.fps); update(); } requestAnimationFrame(loop); };
    loop();
  }
}
function beatAt(f) {
  const t = f / meta.fps;
  const cues = meta.events.filter((e) => e.type === 'cue' && e.vt <= t + 1e-6);
  return cues.length ? cues[cues.length - 1].label : '';
}
function update() {
  $('#fr').textContent = frame;
  $('#tm').textContent = (frame / meta.fps).toFixed(2) + 's';
  const b = beatAt(frame);
  $('#beat').textContent = b ? `beat: ${b}` : '';
  $('#play').textContent = v.paused ? 'Play' : 'Pause';
  drawTimeline();
  paintShown();
}

// Saved drawings show on their exact frame (and while that note is selected).
const imgCache = {};
function paintShown() {
  const ctx = show.getContext('2d');
  ctx.clearRect(0, 0, show.width, show.height);
  if (!v.paused) return;
  for (const n of notes) {
    if (!n.drawing || (n.frame !== frame)) continue;
    const img = imgCache[n.id] ??= Object.assign(new Image(), { src: `/api/notes/${n.id}/png` });
    if (img.complete) ctx.drawImage(img, 0, 0, show.width, show.height);
    else img.onload = paintShown;
  }
}

function drawTimeline() {
  if (!meta) return;
  const ctx = tl.getContext('2d'), W = tl.width, H = tl.height, d = devicePixelRatio;
  const x = (f) => (f / (meta.frames - 1)) * (W - 2 * d) + d;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#262a33';
  ctx.fillRect(0, H * 0.35, W, H * 0.3);
  // Beat spans from director cues.
  ctx.font = `${10 * d}px system-ui`;
  // Labels drop to a second row when they would collide with the previous one.
  const rowEnd = [-Infinity, -Infinity];
  for (const e of meta.events) {
    const fx = x(Math.round(e.vt * meta.fps));
    if (e.type === 'cue') {
      ctx.fillStyle = '#ffd23a88';
      ctx.fillRect(fx, 0, d, H);
      const w = ctx.measureText(e.label).width;
      const row = fx > rowEnd[0] ? 0 : fx > rowEnd[1] ? 1 : -1;
      if (row >= 0) {
        ctx.fillStyle = '#ffd23a';
        ctx.fillText(e.label, fx + 3 * d, (row ? 44 : 10) * d);
        rowEnd[row] = fx + w + 8 * d;
      }
    } else {
      ctx.fillStyle = '#7b8bd8';
      ctx.fillRect(fx, H * 0.62, d, H * 0.12);
    }
  }
  for (const n of notes) {
    ctx.fillStyle = n.status === 'done' ? '#4fd18b' : '#ff5a7a';
    ctx.beginPath();
    ctx.arc(x(n.frame), H * 0.5, (n === sel ? 7 : 5) * d, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#fff';
  ctx.fillRect(x(frame) - d, 0, 2 * d, H);
}
let scrubbing = false;
const scrub = (e) => {
  const r = tl.getBoundingClientRect();
  v.pause();
  goto(Math.round(((e.clientX - r.left) / r.width) * (meta.frames - 1)));
};
tl.addEventListener('pointerdown', (e) => { scrubbing = true; tl.setPointerCapture(e.pointerId); scrub(e); });
tl.addEventListener('pointermove', (e) => scrubbing && scrub(e));
tl.addEventListener('pointerup', () => (scrubbing = false));

// Brush: strokes in video pixel space, redrawn on undo.
function setDraw(on) {
  drawing = on;
  $('#drawBtn').classList.toggle('on', on);
  $('#drawBtn').setAttribute('aria-pressed', on);
  ink.classList.toggle('draw', on);
  if (on) v.pause(), update();
}
function redrawInk() {
  const ctx = ink.getContext('2d');
  ctx.clearRect(0, 0, ink.width, ink.height);
  ctx.lineCap = ctx.lineJoin = 'round';
  for (const s of strokes) {
    ctx.strokeStyle = s.color;
    ctx.lineWidth = s.width;
    ctx.beginPath();
    s.pts.forEach(([px, py], i) => (i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)));
    if (s.pts.length === 1) ctx.lineTo(s.pts[0][0] + 0.1, s.pts[0][1]);
    ctx.stroke();
  }
}
const toPx = (e) => {
  const r = ink.getBoundingClientRect();
  return [((e.clientX - r.left) / r.width) * ink.width, ((e.clientY - r.top) / r.height) * ink.height];
};
let cur = null;
ink.addEventListener('pointerdown', (e) => {
  if (!drawing) return;
  ink.setPointerCapture(e.pointerId);
  cur = { color, width: meta.width / 90, pts: [toPx(e)] };
  strokes.push(cur);
  redrawInk();
});
ink.addEventListener('pointermove', (e) => { if (cur) { cur.pts.push(toPx(e)); redrawInk(); } });
ink.addEventListener('pointerup', () => (cur = null));

async function addNote() {
  const text = $('#text').value.trim();
  if (!text && !strokes.length) return;
  v.pause();
  const body = { version, frame, text, author: localStorage.reviewer || '' };
  if (strokes.length) body.png = ink.toDataURL('image/png');
  $('#add').disabled = true;
  await fetch('/api/notes', { method: 'POST', body: JSON.stringify(body) });
  $('#add').disabled = false;
  $('#text').value = '';
  strokes = [];
  redrawInk();
  setDraw(false);
  await fetchVersions();
  renderVersions();
  await reload();
}

function renderNotes() {
  const box = $('#notes');
  box.innerHTML = '';
  if (!notes.length) box.innerHTML = version > 1
    ? `<p class="hint" style="padding:8px">Fresh render v${version}, no notes yet. Earlier notes stay with their version (menu above).</p>`
    : '<p class="hint" style="padding:8px">No notes yet. Pause on a frame, type and/or draw, then Add note.</p>';
  for (const n of notes) {
    const el = document.createElement('div');
    el.className = `note ${n.status}` + (n === sel ? ' sel' : '');
    el.innerHTML = `<div class="head"><span class="dot"></span>f ${n.frame} · ${(n.frame / meta.fps).toFixed(2)}s${n.beat ? ' · ' + n.beat : ''}${n.drawing ? ' · ✎' : ''}</div><div class="text"></div>${n.reply ? '<div class="reply"></div>' : ''}<div class="acts"><button data-a="toggle">${n.status === 'done' ? 'Reopen' : 'Resolve'}</button><button data-a="del">Delete</button></div>`;
    el.querySelector('.text').textContent = n.text || '(drawing)';
    if (n.reply) el.querySelector('.reply').textContent = '↳ ' + n.reply;
    el.onclick = async (e) => {
      const a = e.target.dataset?.a;
      if (a === 'toggle') await fetch(`/api/notes/${n.id}`, { method: 'PATCH', body: JSON.stringify({ status: n.status === 'done' ? 'open' : 'done' }) });
      if (a === 'del' && confirm('Delete this note?')) await fetch(`/api/notes/${n.id}`, { method: 'DELETE' });
      if (a) return reload();
      sel = n;
      v.pause();
      goto(n.frame);
      renderNotes();
    };
    box.appendChild(el);
  }
}

$('#play').onclick = () => (v.paused ? v.play() : v.pause(), update());
$('#prev').onclick = () => (v.pause(), goto(frame - 1));
$('#next').onclick = () => (v.pause(), goto(frame + 1));
$('#drawBtn').onclick = () => setDraw(!drawing);
$('#undo').onclick = () => (strokes.pop(), redrawInk());
$('#clear').onclick = () => ((strokes = []), redrawInk());
$('#add').onclick = addNote;
v.addEventListener('pause', update);
v.addEventListener('play', () => { setDraw(false); update(); });
v.addEventListener('ended', update);

addEventListener('keydown', (e) => {
  const typing = document.activeElement === $('#text');
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') return e.preventDefault(), addNote();
  if ((e.metaKey || e.ctrlKey) && e.key === 'z' && strokes.length) return e.preventDefault(), strokes.pop(), redrawInk();
  if (typing) return;
  const step = e.shiftKey ? 10 : 1;
  if (e.key === ' ') { e.preventDefault(); $('#play').click(); }
  else if (e.key === 'ArrowLeft') { v.pause(); goto(frame - step); }
  else if (e.key === 'ArrowRight') { v.pause(); goto(frame + step); }
  else if (e.key === 'd' || e.key === 'D') setDraw(!drawing);
  else if (e.key === '[' || e.key === ']') {
    const list = e.key === ']' ? notes.filter((n) => n.frame > frame) : notes.filter((n) => n.frame < frame).reverse();
    if (list[0]) { sel = list[0]; v.pause(); goto(sel.frame); renderNotes(); }
  }
});

init();
</script>
</body>
</html>
