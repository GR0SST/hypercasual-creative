<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Review</title>
<style>
  :root { --bg: #14161b; --panel: #1c1f26; --line: #2b2f39; --text: #e8eaf0; --dim: #8b90a0; --accent: #ffd23a; --open: #ff5a7a; --done: #4fd18b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  body { display: grid; grid-template-columns: 1fr 360px; grid-template-rows: 1fr auto; height: 100vh; }
  #stage { position: relative; display: grid; place-items: center; overflow: hidden; padding: 16px; }
  #frame { position: relative; height: 100%; max-width: 100%; }
  #frame video, #frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #frame canvas.draw { cursor: crosshair; }
  #frame canvas:not(.draw) { pointer-events: none; }
  #bar { grid-column: 1 / 2; padding: 10px 16px 14px; border-top: 1px solid var(--line); background: var(--panel); }
  #controls { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  #controls .readout { font-variant-numeric: tabular-nums; margin-left: auto; color: var(--dim); }
  #controls .readout b { color: var(--text); }
  #beat { color: var(--accent); }
  button { background: #2a2e38; color: var(--text); border: 1px solid #3a3f4c; border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button:hover { background: #343947; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.on { background: var(--accent); color: #111; border-color: var(--accent); }
  #timeline { width: 100%; height: 46px; display: block; cursor: pointer; }
  aside { grid-row: 1 / 3; grid-column: 2; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside h1 { font-size: 15px; margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  aside h1 small { color: var(--dim); font-weight: 400; }
  #compose { padding: 12px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  #compose textarea { width: 100%; min-height: 70px; resize: vertical; background: #13151a; color: var(--text); border: 1px solid #3a3f4c; border-radius: 8px; padding: 8px; font: inherit; }
  #tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
  .swatch.on { border-color: #fff; }
  #notes { overflow: auto; flex: 1; padding: 8px; }
  .note { padding: 10px; border-radius: 10px; border: 1px solid var(--line); margin-bottom: 8px; cursor: pointer; }
  .note:hover { background: #232733; }
  .note.sel { border-color: var(--accent); }
  .note .head { display: flex; gap: 8px; align-items: center; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .note .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--open); }
  .note.done .dot { background: var(--done); }
  .note.done .text { color: var(--dim); text-decoration: line-through; }
  .note .text { margin-top: 4px; white-space: pre-wrap; }
  .note .reply { margin-top: 6px; color: var(--done); font-size: 12px; }
  .note .acts { margin-top: 6px; display: flex; gap: 6px; }
  .note .acts button { padding: 2px 8px; font-size: 12px; }
  .hint { color: var(--dim); font-size: 12px; }
  kbd { background: #2a2e38; border: 1px solid #3a3f4c; border-radius: 4px; padding: 0 4px; font-size: 11px; }
</style>
</head>
<body>
  <div id="stage">
    <div id="frame">
      <video id="v" src="/video" preload="auto" playsinline></video>
      <canvas id="show"></canvas>
      <canvas id="ink"></canvas>
    </div>
  </div>
  <div id="bar">
    <div id="controls">
      <button id="play" title="Space">Play</button>
      <button id="prev" title="←">−1</button>
      <button id="next" title="→">+1</button>
      <span id="beat"></span>
      <span class="readout">frame <b id="fr">0</b> / <span id="frs">0</span> · <b id="tm">0.00s</b></span>
    </div>
    <canvas id="timeline"></canvas>
  </div>
  <aside>
    <h1 id="title">Review <small></small></h1>
    <div id="compose">
      <textarea id="text" placeholder="What should change on this frame?"></textarea>
      <div id="tools">
        <button id="drawBtn" title="D">Draw</button>
        <span id="swatches"></span>
        <button id="undo" title="Cmd+Z">Undo</button>
        <button id="clear">Clear</button>
        <button id="add" class="on" title="Cmd+Enter" style="margin-left:auto">Add note</button>
      </div>
      <div class="hint"><kbd>Space</kbd> play · <kbd>←</kbd><kbd>→</kbd> frame · <kbd>Shift</kbd> ×10 · <kbd>D</kbd> draw · <kbd>⌘↵</kbd> add · <kbd>[</kbd><kbd>]</kbd> prev/next note</div>
    </div>
    <div id="notes"></div>
  </aside>
<script>
const $ = (s) => document.querySelector(s);
const v = $('#v'), ink = $('#ink'), show = $('#show'), tl = $('#timeline');
const COLORS = ['#ff3b5c', '#ffd23a', '#3be27a', '#3bb8ff', '#ffffff'];
let meta, notes = [], frame = 0, drawing = false, strokes = [], color = COLORS[0], sel = null;

const fit = () => {
  const box = $('#stage').getBoundingClientRect();
  const h = Math.min(box.height - 32, (box.width - 32) * meta.height / meta.width);
  $('#frame').style.height = h + 'px';
  $('#frame').style.width = (h * meta.width / meta.height) + 'px';
  tl.width = tl.clientWidth * devicePixelRatio;
  tl.height = tl.clientHeight * devicePixelRatio;
  drawTimeline();
};

async function init() {
  meta = await (await fetch('/api/meta')).json();
  for (const c of [ink, show]) { c.width = meta.width; c.height = meta.height; }
  $('#title small').textContent = `${meta.name} · ${meta.fps}fps`;
  $('#frs').textContent = meta.frames - 1;
  COLORS.forEach((c) => {
    const b = document.createElement('button');
    b.className = 'swatch' + (c === color ? ' on' : '');
    b.style.background = c;
    b.setAttribute('aria-label', `Brush ${c}`);
    b.onclick = () => { color = c; document.querySelectorAll('.swatch').forEach((x) => x.classList.toggle('on', x === b)); setDraw(true); };
    $('#swatches').appendChild(b);
  });
  await reload();
  addEventListener('resize', fit);
  fit();
  goto(0);
  tick();
}

async function reload() {
  notes = (await (await fetch('/api/notes')).json()).sort((a, b) => a.frame - b.frame);
  renderNotes();
  drawTimeline();
  paintShown();
}

// Frame clock: rVFC gives the presented frame's media time during playback.
const timeOf = (f) => (f + 0.5) / meta.fps;
function goto(f) {
  frame = Math.max(0, Math.min(meta.frames - 1, f));
  v.currentTime = timeOf(frame);
  update();
}
function tick() {
  if ('requestVideoFrameCallback' in v) {
    const cb = (_, m) => { if (!v.paused) { frame = Math.min(meta.frames - 1, Math.floor(m.mediaTime * meta.fps + 1e-3)); update(); } v.requestVideoFrameCallback(cb); };
    v.requestVideoFrameCallback(cb);
  } else {
    const loop = () => { if (!v.paused) { frame = Math.floor(v.currentTime * meta.fps); update(); } requestAnimationFrame(loop); };
    loop();
  }
}
function beatAt(f) {
  const t = f / meta.fps;
  const cues = meta.events.filter((e) => e.type === 'cue' && e.vt <= t + 1e-6);
  return cues.length ? cues[cues.length - 1].label : '';
}
function update() {
  $('#fr').textContent = frame;
  $('#tm').textContent = (frame / meta.fps).toFixed(2) + 's';
  const b = beatAt(frame);
  $('#beat').textContent = b ? `beat: ${b}` : '';
  $('#play').textContent = v.paused ? 'Play' : 'Pause';
  drawTimeline();
  paintShown();
}

// Saved drawings show on their exact frame (and while that note is selected).
const imgCache = {};
function paintShown() {
  const ctx = show.getContext('2d');
  ctx.clearRect(0, 0, show.width, show.height);
  if (!v.paused) return;
  for (const n of notes) {
    if (!n.drawing || (n.frame !== frame)) continue;
    const img = imgCache[n.id] ??= Object.assign(new Image(), { src: `/api/notes/${n.id}/png` });
    if (img.complete) ctx.drawImage(img, 0, 0, show.width, show.height);
    else img.onload = paintShown;
  }
}

function drawTimeline() {
  if (!meta) return;
  const ctx = tl.getContext('2d'), W = tl.width, H = tl.height, d = devicePixelRatio;
  const x = (f) => (f / (meta.frames - 1)) * (W - 2 * d) + d;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#262a33';
  ctx.fillRect(0, H * 0.35, W, H * 0.3);
  // Beat spans from director cues.
  ctx.font = `${10 * d}px system-ui`;
  for (const e of meta.events) {
    const fx = x(Math.round(e.vt * meta.fps));
    if (e.type === 'cue') {
      ctx.fillStyle = '#ffd23a88';
      ctx.fillRect(fx, 0, d, H);
      ctx.fillStyle = '#ffd23a';
      ctx.fillText(e.label, fx + 3 * d, 10 * d);
    } else {
      ctx.fillStyle = '#7b8bd8';
      ctx.fillRect(fx, H * 0.62, d, H * 0.12);
    }
  }
  for (const n of notes) {
    ctx.fillStyle = n.status === 'done' ? '#4fd18b' : '#ff5a7a';
    ctx.beginPath();
    ctx.arc(x(n.frame), H * 0.5, (n === sel ? 7 : 5) * d, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#fff';
  ctx.fillRect(x(frame) - d, 0, 2 * d, H);
}
let scrubbing = false;
const scrub = (e) => {
  const r = tl.getBoundingClientRect();
  v.pause();
  goto(Math.round(((e.clientX - r.left) / r.width) * (meta.frames - 1)));
};
tl.addEventListener('pointerdown', (e) => { scrubbing = true; tl.setPointerCapture(e.pointerId); scrub(e); });
tl.addEventListener('pointermove', (e) => scrubbing && scrub(e));
tl.addEventListener('pointerup', () => (scrubbing = false));

// Brush: strokes in video pixel space, redrawn on undo.
function setDraw(on) {
  drawing = on;
  $('#drawBtn').classList.toggle('on', on);
  ink.classList.toggle('draw', on);
  if (on) v.pause(), update();
}
function redrawInk() {
  const ctx = ink.getContext('2d');
  ctx.clearRect(0, 0, ink.width, ink.height);
  ctx.lineCap = ctx.lineJoin = 'round';
  for (const s of strokes) {
    ctx.strokeStyle = s.color;
    ctx.lineWidth = s.width;
    ctx.beginPath();
    s.pts.forEach(([px, py], i) => (i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)));
    if (s.pts.length === 1) ctx.lineTo(s.pts[0][0] + 0.1, s.pts[0][1]);
    ctx.stroke();
  }
}
const toPx = (e) => {
  const r = ink.getBoundingClientRect();
  return [((e.clientX - r.left) / r.width) * ink.width, ((e.clientY - r.top) / r.height) * ink.height];
};
let cur = null;
ink.addEventListener('pointerdown', (e) => {
  if (!drawing) return;
  ink.setPointerCapture(e.pointerId);
  cur = { color, width: meta.width / 90, pts: [toPx(e)] };
  strokes.push(cur);
  redrawInk();
});
ink.addEventListener('pointermove', (e) => { if (cur) { cur.pts.push(toPx(e)); redrawInk(); } });
ink.addEventListener('pointerup', () => (cur = null));

async function addNote() {
  const text = $('#text').value.trim();
  if (!text && !strokes.length) return;
  v.pause();
  const body = { frame, text, author: localStorage.reviewer || '' };
  if (strokes.length) body.png = ink.toDataURL('image/png');
  $('#add').disabled = true;
  await fetch('/api/notes', { method: 'POST', body: JSON.stringify(body) });
  $('#add').disabled = false;
  $('#text').value = '';
  strokes = [];
  redrawInk();
  setDraw(false);
  await reload();
}

function renderNotes() {
  const box = $('#notes');
  box.innerHTML = '';
  if (!notes.length) box.innerHTML = '<p class="hint" style="padding:8px">No notes yet. Pause on a frame, type and/or draw, then Add note.</p>';
  for (const n of notes) {
    const el = document.createElement('div');
    el.className = `note ${n.status}` + (n === sel ? ' sel' : '');
    el.innerHTML = `<div class="head"><span class="dot"></span>f ${n.frame} · ${(n.frame / meta.fps).toFixed(2)}s${n.beat ? ' · ' + n.beat : ''}${n.drawing ? ' · ✎' : ''}</div><div class="text"></div>${n.reply ? '<div class="reply"></div>' : ''}<div class="acts"><button data-a="toggle">${n.status === 'done' ? 'Reopen' : 'Resolve'}</button><button data-a="del">Delete</button></div>`;
    el.querySelector('.text').textContent = n.text || '(drawing)';
    if (n.reply) el.querySelector('.reply').textContent = '↳ ' + n.reply;
    el.onclick = async (e) => {
      const a = e.target.dataset?.a;
      if (a === 'toggle') await fetch(`/api/notes/${n.id}`, { method: 'PATCH', body: JSON.stringify({ status: n.status === 'done' ? 'open' : 'done' }) });
      if (a === 'del' && confirm('Delete this note?')) await fetch(`/api/notes/${n.id}`, { method: 'DELETE' });
      if (a) return reload();
      sel = n;
      v.pause();
      goto(n.frame);
      renderNotes();
    };
    box.appendChild(el);
  }
}

$('#play').onclick = () => (v.paused ? v.play() : v.pause(), update());
$('#prev').onclick = () => (v.pause(), goto(frame - 1));
$('#next').onclick = () => (v.pause(), goto(frame + 1));
$('#drawBtn').onclick = () => setDraw(!drawing);
$('#undo').onclick = () => (strokes.pop(), redrawInk());
$('#clear').onclick = () => ((strokes = []), redrawInk());
$('#add').onclick = addNote;
v.addEventListener('pause', update);
v.addEventListener('play', () => { setDraw(false); update(); });
v.addEventListener('ended', update);

addEventListener('keydown', (e) => {
  const typing = document.activeElement === $('#text');
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') return e.preventDefault(), addNote();
  if ((e.metaKey || e.ctrlKey) && e.key === 'z' && strokes.length) return e.preventDefault(), strokes.pop(), redrawInk();
  if (typing) return;
  const step = e.shiftKey ? 10 : 1;
  if (e.key === ' ') { e.preventDefault(); $('#play').click(); }
  else if (e.key === 'ArrowLeft') { v.pause(); goto(frame - step); }
  else if (e.key === 'ArrowRight') { v.pause(); goto(frame + step); }
  else if (e.key === 'd' || e.key === 'D') setDraw(!drawing);
  else if (e.key === '[' || e.key === ']') {
    const list = e.key === ']' ? notes.filter((n) => n.frame > frame) : notes.filter((n) => n.frame < frame).reverse();
    if (list[0]) { sel = list[0]; v.pause(); goto(sel.frame); renderNotes(); }
  }
});

init();
</script>
</body>
</html>
