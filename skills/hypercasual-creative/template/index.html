<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Hypercasual creative</title>
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./node_modules/three/examples/jsm/"
        }
      }
    </script>
    <link rel="stylesheet" href="src/overlay/style.css" />
  </head>
  <body>
    <!-- data-duration must equal DURATION, data-fps must equal FPS (src/timing.js) -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-fps="60" data-width="1080" data-height="1920">
      <canvas id="gl" data-layout-allow-overflow width="1080" height="1920"></canvas>
      <div id="hud" class="layer"></div>
      <div id="packshot" class="layer ps">
        <div class="ps-veil"></div>
        <div class="ps-rays"></div>
        <div class="ps-icon">●‿●</div>
        <div class="ps-logo">BLOB RUSH</div>
        <div class="ps-tag">EAT. GROW. WIN!</div>
        <div class="ps-ripple"></div>
        <div class="ps-btn" data-layout-allow-overlap data-layout-allow-occlusion><div class="ps-btn-face">PLAY NOW</div></div>
        <div class="ps-hand" data-layout-allow-overlap data-layout-allow-occlusion data-layout-allow-overflow>👆</div>
      </div>
      <!-- SFX/music: generated by `bun scripts/sfx-sync.mjs` from events.json -->
      <div id="audio-track">
        
      </div>
    </div>
    <script>
      // Root timeline is registered here (lint reads inline scripts); the
      // module in src/main.js appends the packshot tweens to it.
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
