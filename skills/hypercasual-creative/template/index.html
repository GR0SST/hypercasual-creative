<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hypercasual creative</title>
    <script src="node_modules/gsap/dist/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/addons/": "./node_modules/three/examples/jsm/"
        }
      }
    </script>
    <link rel="stylesheet" href="src/overlay/style.css" />
  </head>
  <body>
    <!-- 1080x1920 stage; scaled to fit the window in dev, 1:1 when capturing. -->
    <div id="root">
      <canvas id="gl" width="1080" height="1920"></canvas>
      <div id="hud" class="layer"></div>
      <div id="packshot" class="layer ps">
        <div class="ps-veil"></div>
        <div class="ps-rays"></div>
        <div class="ps-icon">●‿●</div>
        <div class="ps-logo">BLOB RUSH</div>
        <div class="ps-tag">EAT. GROW. WIN!</div>
        <div class="ps-ripple"></div>
        <div class="ps-btn"><div class="ps-btn-face">PLAY NOW</div></div>
        <div class="ps-hand">👆</div>
      </div>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
